# Mirror of .github/workflows/android.yml and lint.yml: docs check, unit tests, lint and the debug APK.
# One workflow on purpose: a small CI host has little memory, so the steps share one Gradle daemon and run in order.
when:
  - event: [push, pull_request, manual]

steps:
  docs:
    image: health-journal-ci:1
    pull: false
    commands:
      - bash scripts/check-docs.sh

  test:
    image: health-journal-ci:1
    pull: false
    commands:
      - chmod +x gradlew
      - ./gradlew test

  coverage:
    image: health-journal-ci:1
    pull: false
    failure: ignore
    commands:
      - ./gradlew :domain:jacocoTestReport :data:createDebugUnitTestCoverageReport :app:createDebugUnitTestCoverageReport

  lint:
    image: health-journal-ci:1
    pull: false
    commands:
      - ./gradlew :app:lintDebug

  apk:
    image: health-journal-ci:1
    pull: false
    commands:
      - ./gradlew assembleDebug
