name: OpenSpec

on:
  pull_request:
    branches: [ "master", "main" ]
    paths: [ "openspec/**" ]
  push:
    branches: [ "master", "main" ]
    paths: [ "openspec/**" ]
  workflow_dispatch:

jobs:
  validate:
    name: Validate specs and changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate every spec and change (strict)
        run: npx --yes @fission-ai/openspec@1.13.1 validate --all --strict
