name: Instrumented Tests

# The real Android Keystore and the native SQLCipher library only exist on a device,
# so these tests (data/src/androidTest) run on an emulator. Kept apart from the main
# workflow: an emulator run is slow and should not delay the unit tests or a release.
on:
  pull_request:
    branches: [ "master", "main" ]
    paths:
      - 'data/**'
      - 'domain/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/instrumented.yml'
  push:
    branches: [ "master", "main" ]
    paths:
      - 'data/**'
      - 'domain/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/instrumented.yml'
  workflow_dispatch:

concurrency:
  group: instrumented-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connected:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The hosted runners have KVM, but only usable after this rule; without it the emulator is far too slow.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          script: ./gradlew :data:connectedDebugAndroidTest --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-reports
          path: |
            data/build/reports/androidTests
            data/build/outputs/androidTest-results
          if-no-files-found: ignore
          retention-days: 14
