name: Android CI & Build APK

on:
  push:
    branches: [ "master", "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write  # needed to create GitHub Releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check developer docs
        run: bash scripts/check-docs.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew test

      - name: Unit test coverage (JaCoCo)
        id: coverage
        continue-on-error: true
        run: ./gradlew :domain:jacocoTestReport :data:createDebugUnitTestCoverageReport :app:createDebugUnitTestCoverageReport

      - name: Code statistics and coverage summary
        if: always()
        continue-on-error: true
        run: |
          sudo apt-get install -y --no-install-recommends cloc > /dev/null
          bash scripts/job-summary.sh

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            domain/build/reports/jacoco/test
            data/build/reports/coverage/test/debug
            app/build/reports/coverage/test/debug
          if-no-files-found: ignore
          retention-days: 14

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK with version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME}"
          cp app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/health-journal-${VERSION}-debug.apk

      - name: Upload APK Artifact (CI runs)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: health-journal-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v h="## [$VERSION]" 'index($0,h)==1{f=1;next} index($0,"## [")==1{f=0} f' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG section for $VERSION; release notes will be generated from commits"
          fi
          {
            echo
            echo '### Install'
            echo "1. Download health-journal-${GITHUB_REF_NAME}-debug.apk below."
            echo '2. On your Android device, open the file and tap **Install**.'
            echo '3. Enable *Install from unknown sources* if prompted. Updating over an earlier release keeps your data.'
          } >> RELEASE_NOTES.md

      - name: Create GitHub Release & upload APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Health Journal ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: app/build/outputs/apk/debug/health-journal-${{ github.ref_name }}-debug.apk
          draft: false
          prerelease: false
