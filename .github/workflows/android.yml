name: Android CI & Build APK

on:
  push:
    branches: [ "master", "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write  # needed to create GitHub Releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew test

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK with version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME}"
          cp app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/health-journal-${VERSION}-debug.apk

      - name: Upload APK Artifact (CI runs)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: health-journal-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release & upload APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Health Journal ${{ github.ref_name }}"
          body: |
            ## Health Journal ${{ github.ref_name }}

            ### What's new
            See [CHANGELOG](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}) for full details.

            ### Install
            1. Download `health-journal-${{ github.ref_name }}-debug.apk` below.
            2. On your Android device, open the file and tap **Install**.
            3. Enable *Install from unknown sources* if prompted.
          files: app/build/outputs/apk/debug/health-journal-${{ github.ref_name }}-debug.apk
          draft: false
          prerelease: false
